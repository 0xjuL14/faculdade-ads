<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Exercícios aula 15</title>
</head>
<body>
<main>
    <h1>Sistema de Cadastro de Alunos</h1>

    <section>
        <h2>Cadastro de Alunos</h2>
        <form id="formulario">
            <label for="nomealuno">Informe o nome do aluno:</label><br>
            <input type="text" id="nomealuno" name="nomealuno" placeholder="Ex.: Julia" required><br>

            <h3>Notas</h3>
                <label for="nota1">Informe a 1ª nota:</label><br>
                <input type="number" id="nota1" name="nota1" min="0" max="10" step="0.1" placeholder="Ex.: 8.5" required><br>

                <label for="nota2">Informe a 2ª nota:</label><br>
                <input type="number" id="nota2" name="nota2" min="0" max="10" step="0.1" placeholder="Ex.: 10" required><br>

                <label for="frequencia">Informe a frequência (em %):</label><br>
                <input type="number" id="frequencia" name="frequencia" min="0" max="100" placeholder="Ex.: 95" required><br>

            <h3>Endereço</h3>
                <label for="cep">Informe o CEP:</label><br>
                <input type="text" id="cep" name="cep" placeholder="Ex.: 01001-000">
                <button id="buscarcep" type="button">Buscar CEP</button><br>
                <p id="mensagemcep"></p>

            <label for="rua">Rua:</label>
            <input type="text" id="rua" name="rua"><br>

            <div class="linha">
                <div>
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero">
                </div>
                <div>
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento">
                </div>
            </div>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro"><br>

            <div class="linha">
                <div>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade">
                </div>
                <div>
                    <label for="uf">UF:</label>
                    <input type="text" id="uf" name="uf" maxlength="2">
                </div>
            </div>

            <br><button id="cadastrar" type="button">Cadastrar aluno!</button>
        </form>
    </section>

    <section>
        <h2>Consultar aluno por ID</h2> <!-- Ex. 2: consulta por id com find -->
        <label for="buscaid">ID do aluno:</label>
        <input type="number" id="buscaid" min="1" placeholder="Ex.: 3">
        <button id="consultarid" type="button">Consultar</button>
        <p id="resultadoid"></p>
    </section>

    <section>
        <h2>Alunos cadastrados</h2> <!-- Ex. 3 e 5: busca, filtro de situação e ordenação -->
        <div class="linha">
            <div>
                <label for="busca">Buscar por nome:</label>
                <input type="search" id="busca" placeholder="Ex.: ana">
            </div>
            <div>
                <label for="filtrosituacao">Situação:</label>
                <select id="filtrosituacao"> <!-- os value precisam ser iguais aos textos de calcularSituacao()!!!! -->
                    <option value="Todos">Todos</option>
                    <option value="Aprovado">Aprovado</option>
                    <option value="Recuperação">Recuperação</option>
                    <option value="Reprovado por nota">Reprovado por nota</option>
                    <option value="Reprovado por frequência">Reprovado por frequência</option>
                </select>
            </div>
            <div>
                <label for="ordem">Ordenar por:</label>
                <select id="ordem">
                    <option value="cadastro">Ordem de cadastro</option>
                    <option value="nome">Nome A–Z</option>
                    <option value="cresc">Média crescente</option>
                    <option value="decresc">Média decrescente</option>
                </select>
            </div>
            <div>
                <button id="limpar" type="button">Limpar filtros</button>
            </div>
        </div>

        <p id="contador"></p>

        <table border="1">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Nota 1</th>
                <th>Nota 2</th>
                <th>Frequência</th>
                <th>Média</th>
                <th>Situação</th>
                <th>Endereço</th>
                <th>Opções</th>
            </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </section>
    <section>
        <h2>Relatório (nome, média e situação)</h2> <!-- Ex. 4: relatório com map -->
        <button id="gerarrelatorio" type="button">Gerar relatório</button>
        <ul id="relatorio"></ul>
    </section>
</main>
<script src="JS/script.js"></script>
</body>
</html>
